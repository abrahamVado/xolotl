//1.- Configura los plugins de Gradle disponibles a nivel de proyecto.
plugins {
    //2.- Declara el plugin de aplicación Android sin aplicarlo globalmente.
    id 'com.android.application' version '8.3.2' apply false
    //3.- Declara el plugin de Kotlin Android fijando explícitamente la versión compatible con AGP 8.x.
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

//5.- Define repositorios por defecto para todos los subproyectos.
allprojects {
    repositories {
        //1.- google() usa el endpoint principal de Maven para dependencias Android.
        google()
        //2.- Provee una URL directa alternativa a maven.google.com para redes con inspección TLS.
        maven {
            url 'https://maven.google.com'
            content { includeGroupByRegex 'com\\.android\\..*' }
        }
        //3.- Añade un mirror basado en Cloud Storage que evita errores de Tag mismatch.
        maven {
            url 'https://maven-central.storage-download.googleapis.com/maven2/'
            content { includeGroupByRegex 'com\\.android\\..*' }
        }
        //4.- Complementa con Maven Central para bibliotecas no provistas por Google.
        mavenCentral()
    }
}

//6.- Estandariza las carpetas de compilación para mantener limpio el árbol del proyecto.
rootProject.buildDir = '../build'
subprojects {
    project -> project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

//7.- Tarea auxiliar para limpiar los artefactos generados.
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
