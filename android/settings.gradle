//1.- Gestiona la configuración de plugins cargando primero la ruta del SDK de Flutter.
pluginManagement {
    //2.- Lee el archivo local.properties para obtener el SDK de Flutter requerido.
    def localProperties = new Properties()
    def localPropertiesFile = new File(rootDir, 'local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { reader ->
            localProperties.load(reader)
        }
    }
    def flutterSdkPath = localProperties.getProperty('flutter.sdk')
    if (flutterSdkPath == null) {
        throw new GradleException('Flutter SDK not found. Define flutter.sdk in the local.properties file.')
    }
    //3.- Expone los plugins generados por Flutter como un build incluido.
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
    //4.- Declara los repositorios de los que se podrán descargar plugins externos.
    repositories {
        //1.- google() referencia el repositorio oficial de plugins Android.
        google()
        //2.- Mirror alternativo para evitar respuestas corruptas desde dl.google.com.
        maven {
            url 'https://maven.google.com'
            content { includeGroupByRegex 'com\\.android\\..*' }
        }
        //3.- Usa el bucket de Google Cloud que replica el repositorio para conexiones problemáticas.
        maven {
            url 'https://maven-central.storage-download.googleapis.com/maven2/'
            content { includeGroupByRegex 'com\\.android\\..*' }
        }
        //4.- Gradle Plugin Portal y Maven Central completan las dependencias públicas restantes.
        mavenCentral()
        gradlePluginPortal()
    }
    //5.- Centraliza las versiones de los plugins clave para seguir el proyecto de referencia.
    plugins {
        //1.- Fija la versión del plugin de aplicación Android conforme a la app ciudadana.
        id 'com.android.application' version '8.9.1'
        //2.- Declara Kotlin 2.1.0 para compatibilidad con AGP 8.9.1.
        id 'org.jetbrains.kotlin.android' version '2.1.0'
    }
}

//6.- Registra el plugin que permite a Flutter inyectar configuraciones en Gradle.
plugins {
    id 'dev.flutter.flutter-plugin-loader' version '1.0.0'
}

//7.- Agrega el módulo principal de la aplicación Android al proyecto.
include ':app'
