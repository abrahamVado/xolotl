//1.- Declara los plugins necesarios directamente usando la sintaxis moderna de Gradle.
plugins {
    //2.- Activa el plugin de aplicación Android para generar el APK.
    id 'com.android.application'
    //3.- Habilita el soporte para Kotlin en el módulo Android.
    id 'org.jetbrains.kotlin.android'
    //4.- Conecta el módulo con las tareas generadas por Flutter.
    id 'dev.flutter.flutter-gradle-plugin'
}

//5.- Lee configuraciones compartidas desde local.properties para versionado y rutas.
def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, 'local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')

//6.- Configura parámetros de compilación y empaquetado del módulo Android.
android {
    namespace 'com.example.mictlan_client'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.mictlan_client'
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

//7.- Informa al plugin de Flutter dónde se encuentra el código Dart del proyecto.
flutter {
    source '../..'
}

//8.- Dependencias adicionales necesarias para Kotlin estándar.
dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7'
}
