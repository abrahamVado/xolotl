name: mictlan_client
description: Client prototype for reporting and consulting incidents against the Mictlan Go backend.
publish_to: "none"
version: 0.1.0+1

environment:
  # //1.- Ajustamos el SDK mínimo a la versión compatible con el proyecto de referencia.
  sdk: "^3.9.2"

dependencies:
  flutter:
    sdk: flutter
  # //2.- Sincroniza las dependencias base con la aplicación de referencia para asegurar compatibilidad.
  cupertino_icons: ^1.0.8
  # //3.- Agrega Riverpod para la gestión de estado igual que en la app ciudadana.
  flutter_riverpod: ^2.5.1
  # //4.- Añade Dio para peticiones HTTP avanzadas utilizadas por la app de referencia.
  dio: ^5.7.0
  # //5.- Incluye Equatable para simplificar comparaciones de modelos.
  equatable: ^2.0.5
  google_maps_flutter: ^2.7.0
  http: ^1.2.2
  device_info_plus: ^10.1.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  # //6.- Habilita el sistema de diseño shadcn para alinear tarjetas y botones personalizados.
  shadcn_flutter: ^0.0.44
  # //7.- firebase_core inicializa el SDK de Firebase antes de activar mensajería push.
  firebase_core: ^3.4.0
  # //8.- firebase_messaging administra los tokens FCM y entrega callbacks en primer/plano de fondo.
  firebase_messaging: ^15.1.3
  # //9.- flutter_local_notifications muestra notificaciones nativas cuando llega un mensaje de datos.
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  # //10.- Activa las reglas de lint recomendadas para Flutter.
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    # //11.- assets/icons contendrá los placeholders de íconos suministrados externamente.
    - assets/icons/
